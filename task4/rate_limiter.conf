events {
    worker_connections 1024;
}

http {
    # Определяем зону по IP для веб-приложения — 50 запросов в секунду
    limit_req_zone $binary_remote_addr zone=web_zone:10m rate=50r/s;

    # Определяем зону по IP для мобильного приложения — 30 запросов в секунду
    limit_req_zone $binary_remote_addr zone=mobile_zone:10m rate=30r/s;

    upstream backend {
        server localhost:8081;
    }

    server {
        listen 80;

        # Веб-приложение — до 50 запросов в секунду с одного IP
        location /api/web/ {
            limit_req zone=web_zone burst=100 nodelay;
            proxy_pass http://backend/api/;
            proxy_set_header Client-Type "web";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Мобильное приложение — до 30 запросов в секунду с одного IP
        location /api/mobile/ {
            limit_req zone=mobile_zone burst=60 nodelay;
            proxy_pass http://backend/api/;
            proxy_set_header Client-Type "mobile";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Тестовый сервер для имитации бэкенда приложения
    server {
        listen 8081;

        location /api/ {
            add_header Content-Type application/json;

            # Эмулируем разное поведение в зависимости от заголовка
            if ($http_client_type = "web") {
                return 200 '{"status": "success", "service": "web_backend", "data": "Web application response"}';
            }
            if ($http_client_type = "mobile") {
                return 200 '{"status": "success", "service": "mobile_backend", "data": "Mobile application response"}';
            }

            # Дефолтный ответ
            return 200 '{"status": "success", "service": "default_backend", "data": "Default response"}';
        }
    }
}